version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fishing-app-postgres
    environment:
      POSTGRES_DB: fishing_app
      POSTGRES_USER: fishing_user
      POSTGRES_PASSWORD: fishing_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishing_user -d fishing_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fishing-app
    environment:
      - DATABASE_URL=postgresql://fishing_user:fishing_password@postgres:5432/fishing_app
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data: